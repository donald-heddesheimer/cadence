name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise host-reachable behavior across compilers and build types.
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Check event-pool ownership and concurrent registry access.
  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          case "${{ matrix.sanitizer }}" in
            address-undefined) FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" ;;
            thread)            FLAGS="-fsanitize=thread" ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Measure the host-reachable headers; CUDA paths are preprocessed out on this
  # runner and compile-checked separately below.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCADENCE_BUILD_EXAMPLES=OFF -DCADENCE_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CXX_FLAGS="-O0 -g --coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          # Work around GCC PR 68080; the line-coverage gate is unaffected.
          gcovr -r . --filter 'include/cadence/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --txt coverage.txt --xml coverage.xml \
            --fail-under-line 85
          cat coverage.txt
          # Publish the result on the workflow summary.
          {
            echo '### Coverage (host-reachable headers)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # The local gcovr threshold is authoritative.
          fail_ci_if_error: false

  # Compile CUDA paths and verify clean test skips without a hosted GPU.
  cuda:
    name: cuda build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvtx"]'
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Install and consume cadence through find_package from a separate project.
  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCADENCE_BUILD_TESTS=OFF -DCADENCE_BUILD_EXAMPLES=OFF -DCADENCE_BUILD_BENCHMARKS=OFF
          cmake --install build --prefix "$PWD/staging"
      - name: Consume
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          find_package(cadence REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE cadence::cadence)
          EOF
          cat > consumer/main.cc <<'EOF'
          #include <cadence/cadence.h>
          #include <cassert>
          #include <chrono>
          int main() {
            cadence::Config config;
            config.reportStream = nullptr;
            config.warmupIterations = 0;
            cadence::Configure(config);
            {
              CADENCE_SCOPE("installed");
              // An empty scope can measure zero nanoseconds, which is discarded
              // as a stalled clock rather than kept as a fast one.
              const auto until = std::chrono::steady_clock::now() + std::chrono::microseconds(2);
              while (std::chrono::steady_clock::now() < until) {
              }
            }
            CADENCE_FLUSH();
            assert(cadence::Snapshot().size() == 1);
            return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/staging"
          cmake --build consumer/build -j
          ./consumer/build/consumer

  # Formatting remains editor-guided because the namespace layout is not
  # representable by clang-format.
