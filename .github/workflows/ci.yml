name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The bulk of cadence is testable without a GPU, and that is deliberate: the
  # statistics, the warmup rule, the interning and the CSV are where a wrong
  # number would come from, and none of them need a driver.
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # cadence hands out raw CUDA event handles between threads and recycles them
  # through a pool. Both sanitizers are cheap here and would catch the classes of
  # bug that pooling invites.
  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          case "${{ matrix.sanitizer }}" in
            address-undefined) FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" ;;
            thread)            FLAGS="-fsanitize=thread" ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # No GPU on a hosted runner, so this proves the device path compiles and that
  # the device tests skip cleanly rather than fail when no device answers.
  cuda:
    name: cuda build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvtx"]'
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The import story the README sells: install the package, then consume it from
  # a separate project through find_package.
  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCADENCE_BUILD_TESTS=OFF -DCADENCE_BUILD_EXAMPLES=OFF -DCADENCE_BUILD_BENCHMARKS=OFF
          cmake --install build --prefix "$PWD/staging"
      - name: Consume
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          find_package(cadence REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE cadence::cadence)
          EOF
          cat > consumer/main.cc <<'EOF'
          #include <cadence/cadence.h>
          #include <cassert>
          int main() {
            cadence::Config config;
            config.outputPath.clear();
            config.warmupIterations = 0;
            cadence::Configure(config);
            { CADENCE_SCOPE("installed"); }
            CADENCE_FLUSH();
            assert(cadence::Snapshot().size() == 1);
            return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/staging"
          cmake --build consumer/build -j
          ./consumer/build/consumer

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find include tests examples benchmarks -name '*.h' -o -name '*.cc' -o -name '*.cu' \
            | xargs clang-format --dry-run --Werror
