name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The bulk of cadence is testable without a GPU, and that is deliberate: the
  # statistics, the warmup rule, the interning and the CSV are where a wrong
  # number would come from, and none of them need a driver.
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # cadence hands out raw CUDA event handles between threads and recycles them
  # through a pool. Both sanitizers are cheap here and would catch the classes of
  # bug that pooling invites.
  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          case "${{ matrix.sanitizer }}" in
            address-undefined) FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" ;;
            thread)            FLAGS="-fsanitize=thread" ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # How much of the library the tests actually reach.
  #
  # The scoping solves itself. CADENCE_HAS_CUDA comes from __has_include of
  # <cuda_runtime.h> in platform.h, so on a runner with no CUDA toolkit the
  # device paths are preprocessed away before gcov ever sees them. The number
  # below is therefore the host-reachable surface exactly, with no filter
  # gymnastics and no dilution from lines only a GPU could execute. The device
  # half is compile-checked by the `cuda` job and exercised by
  # cadence_device_tests on real hardware.
  #
  # The gate is set below the number the tests currently reach rather than at it.
  # A threshold pinned to the high-water mark turns every honest refactor into a
  # coverage failure, and the job is here to catch a real regression, not to make
  # the number a ratchet.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCADENCE_BUILD_EXAMPLES=OFF -DCADENCE_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CXX_FLAGS="-O0 -g --coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          # negative_hits is a gcov bug, not a coverage problem: on an inlined
          # ternary it can emit "branch 1 taken -1", which is not a number of
          # times anything happened. See gcc PR 68080. Warning once per file
          # keeps it visible in the log while letting the run finish; the gate
          # below is on lines, which the bug does not touch.
          gcovr -r . --filter 'include/cadence/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --txt coverage.txt --xml coverage.xml \
            --fail-under-line 85
          cat coverage.txt
          # Also on the run's summary page, so the number is readable without
          # opening the log or waiting on a third party.
          {
            echo '### Coverage (host-reachable headers)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # The gate above is what fails a bad change. Codecov is presentation,
          # so an outage there -- or a repo not yet authorized -- must not turn
          # this job red.
          fail_ci_if_error: false

  # No GPU on a hosted runner, so this proves the device path compiles and that
  # the device tests skip cleanly rather than fail when no device answers.
  cuda:
    name: cuda build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvtx"]'
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The import story the README sells: install the package, then consume it from
  # a separate project through find_package.
  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCADENCE_BUILD_TESTS=OFF -DCADENCE_BUILD_EXAMPLES=OFF -DCADENCE_BUILD_BENCHMARKS=OFF
          cmake --install build --prefix "$PWD/staging"
      - name: Consume
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          find_package(cadence REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE cadence::cadence)
          EOF
          cat > consumer/main.cc <<'EOF'
          #include <cadence/cadence.h>
          #include <cassert>
          #include <chrono>
          int main() {
            cadence::Config config;
            config.reportStream = nullptr;
            config.warmupIterations = 0;
            cadence::Configure(config);
            {
              CADENCE_SCOPE("installed");
              // An empty scope can measure zero nanoseconds, which is discarded
              // as a stalled clock rather than kept as a fast one.
              const auto until = std::chrono::steady_clock::now() + std::chrono::microseconds(2);
              while (std::chrono::steady_clock::now() < until) {
              }
            }
            CADENCE_FLUSH();
            assert(cadence::Snapshot().size() == 1);
            return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/staging"
          cmake --build consumer/build -j
          ./consumer/build/consumer

  # No clang-format job. The house style indents only the outermost namespace,
  # which no NamespaceIndentation setting produces, so clang-format cannot be
  # made authoritative here without rewriting every header against the style.
  # .clang-format still describes the intent for editors; it is a guide rather
  # than a gate. Re-add a job here if the namespace rule is ever dropped.
